[package]
name = "legal-service-router"
version = "0.1.0"
edition = "2021"
description = "Constraint-based routing to accessible public legal-service locations"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
